<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户与可可子账号管理</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header class="heading">
      <h1>RTLink 账号管理</h1>
      <button id="refresh" type="button" class="secondary">刷新记录</button>
    </header>
    <nav aria-label="账号管理导航">
      <button id="tab-users" type="button" aria-current="page">用户列表</button>
      <button id="tab-bot" type="button">可可子账号</button>
    </nav>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <section id="users-panel" aria-labelledby="tab-users">
      <div class="stats">
        <article><span>全部用户</span><strong id="stat-total">—</strong><small>按用户 ID 去重</small></article>
        <article><span>已绑定</span><strong id="stat-bound">—</strong><small>至少绑定一个成绩来源</small></article>
        <article><span>已解绑</span><strong id="stat-unbound">—</strong><small>没有有效绑定的历史用户</small></article>
      </div>
      <section class="panel">
        <div class="section-title"><h2>绑定记录</h2><span class="muted">北京时间</span></div>
        <form id="filters" class="filters">
          <label class="search">查找用户<input id="search" type="search" placeholder="用户 ID / 玩家 ID" maxlength="100"></label>
          <label>已绑定来源<select id="source"><option value="">全部来源</option></select></label>
          <label>绑定状态<select id="status"><option value="all">全部状态</option><option value="bound">已绑定</option><option value="unbound">已解绑</option></select></label>
          <button type="submit">搜索</button>
        </form>
        <p id="users-notice" class="list-notice error" role="status" hidden></p>
        <div class="table-wrap"><table><thead><tr><th>用户 ID</th><th>已绑定来源</th><th>最新同步</th><th>当前 Rating</th><th>管理</th></tr></thead><tbody id="users-body"><tr><td colspan="5" class="empty">正在读取用户记录…</td></tr></tbody></table></div>
        <footer class="pagination"><span id="page-info">—</span><div><button id="previous" type="button" class="secondary" disabled>上一页</button><button id="next" type="button" class="secondary" disabled>下一页</button></div></footer>
      </section>
    </section>
    <section id="bot-panel" aria-labelledby="tab-bot" hidden>
      <div class="bot-intro"><div class="avatar" aria-hidden="true">可</div><div><h2>可可子的成绩表</h2><p class="muted">可可子使用自己的绑定查询成绩、Rating 和练习建议。</p></div></div>
      <div id="bot-account" class="account-content"><p class="empty">正在读取可可子账号…</p></div>
    </section>
    <p class="footnote">点击「同步成绩」拉取指定来源的最新成绩并计算 Rating。</p>
  </main>
  <dialog id="account-dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading"><h2 id="dialog-title">用户详情</h2><button id="close-dialog" type="button" class="secondary">关闭</button></div>
    <p id="dialog-notice" role="status" hidden></p>
    <div id="dialog-content" class="account-content"></div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
